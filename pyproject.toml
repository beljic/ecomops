[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecomops"
version = "0.1.0"
description = "Read-only ecommerce log analyzer for Magento, PHP, Nginx, MySQL and cron logs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1.1,<2.2.0",
    "paramiko>=3.4,<4.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.0,<15.0",
    "typer>=0.12,<1.0",
]

[project.scripts]
ecomops = "ecomops.cli.app:main"
ecomops-mcp = "ecomops.mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecomops"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["_bmad", ".claude", ".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
